; ─────────────────────────────────────────────────────────────────────────────
; Custom PHP Configuration untuk CharmOnTi
; File ini di-copy ke /usr/local/etc/php/conf.d/local.ini di dalam container
; ─────────────────────────────────────────────────────────────────────────────

; ── Batas Eksekusi ─────────────────────────────────────────────────────────────
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; ── Upload File ────────────────────────────────────────────────────────────────
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; ── OPCache (cache compiled PHP bytecode di memory) ────────────────────────────
; Membuat aplikasi jauh lebih cepat karena PHP tidak perlu parse ulang setiap request
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.enable_cli = 0

; ── Session ────────────────────────────────────────────────────────────────────
session.gc_maxlifetime = 7200

; ── Error Reporting (production-safe) ──────────────────────────────────────────
expose_php = Off
